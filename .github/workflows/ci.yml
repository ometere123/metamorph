name: Contract CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned repository CLI
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact StudioNet network and CLI
        run: |
          npm exec -- genlayer network set studionet
          npm run check:network
          npm exec -- genlayer --version
      - name: Install GenLayer test and lint tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax compilation
        run: python -m compileall -q contracts tests
      - name: GenVM lint and ABI validation
        run: |
          python -m genvm_linter.cli check contracts/metamorph.py --json
          python -m genvm_linter.cli check contracts/fixture_target.py --json
          python -m genvm_linter.cli check contracts/fixture_consumer.py --json
      - name: Offline and GenVM Direct Mode tests
        run: python -m pytest tests -q
